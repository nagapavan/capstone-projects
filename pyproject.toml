[project]
name = "capstone-projects"
version = "0.1.0"
description = "Capstone projects for the AI/ML course"
requires-python = ">=3.10,<3.14"
dependencies = [
    "catboost>=1.2.10",
    "joblib>=1.5.3",
    "lightgbm>=4.3.0",
    "numpy>=2.0.0",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "scikit-learn>=1.8.0",
    "streamlit>=1.56.0",
    "xgboost>=3.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"